# CPU-feasible LoRA SFT proxy run (no GPU available in this environment).
# Deviations from the GPU recipe (configs/sft_gpu_q35_9b.yaml), all forced by CPU throughput:
#   * 0.8B model instead of 9B; bf16 LoRA instead of 4-bit QLoRA (bitsandbytes 4-bit needs CUDA)
#   * subset of the FinQA train split (max_train_examples) and max_length 2560 (drops ~1% longest)
#   * learning rate 2e-4 (short run: 40 optimizer steps of 16 examples)
#   * 640 examples: measured ~23-28 s per 1.4-1.7k-token example (fwd+bwd, grad checkpointing) on 4 vCPU
model: Qwen/Qwen3.5-0.8B
revision: 2fc06364715b967f1860aea9cf38778875588b17
train_files: [data/processed/finqa_train.jsonl]
max_train_examples: 640
max_length: 2560
seed: 0
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: all-linear
learning_rate: 2.0e-4
per_device_batch_size: 1
grad_accum: 16          # effective batch size 16
epochs: 1
warmup_ratio: 0.05
scheduler: cosine
logging_steps: 1
save_steps: 10
eval_steps: 10
save_total_limit: 10
eval_ids_file: results/subsets/finqa_dev_select60.txt
eval_file: data/processed/finqa_dev.jsonl
gradient_checkpointing: true    # off -> OOM-killed on 15 GB (tested 2026-11-26)
bf16: true
threads: 4
output_dir: checkpoints/sft_cpu_q35_0.8b
